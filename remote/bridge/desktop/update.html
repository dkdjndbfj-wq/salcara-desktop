<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>软件更新</title>
    <!-- main.cjs injects the home screen's shared home-orb.css. -->
    <style>
      :root {
        --bg: #F5F6FA; --card: #ffffff; --text: #141A26; --text-2: #3a4356; --muted: #6A7390; --faint: #9EA8BE; --line: #E6E9F0;
        --soft: #F4F5F9; --track: #E7EAF1; --danger: #E4474C; --ok: #0FA25C;
        --expo: cubic-bezier(.16, 1, .3, 1);
        --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", "Noto Sans CJK SC", sans-serif;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; color: var(--text); font: 13px/1.55 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden;
        display: flex; flex-direction: column; -webkit-app-region: drag; user-select: none;
        background: radial-gradient(360px circle at 50% 70px, rgba(124, 198, 255, .22), rgba(166, 139, 247, .08) 55%, transparent 75%), var(--bg); }
      button, a, .notes { -webkit-app-region: no-drag; }
      .x { position: fixed; top: 12px; right: 12px; width: 30px; height: 30px; border: 0; border-radius: 15px; background: transparent; color: var(--muted);
        display: grid; place-items: center; cursor: pointer; transition: background .18s, color .18s; z-index: 2; }
      .x:hover { background: #fff; color: var(--text); box-shadow: 0 0 0 1px var(--line); }
      .x svg { width: 14px; height: 14px; }

      .top { padding: 18px 28px 0; text-align: center; flex-shrink: 0; }
      .orbwrap { position: relative; width: 180px; height: 168px; margin: 0 auto 12px; display: grid; place-items: center; }
      .check { position: absolute; right: 6px; bottom: 6px; width: 30px; height: 30px; border-radius: 50%; background: var(--ok); color: #fff;
        display: grid; place-items: center; box-shadow: 0 0 0 4px var(--bg); scale: 0; transition: scale .45s cubic-bezier(.34, 1.56, .64, 1); }
      .check svg { width: 15px; height: 15px; }
      .done .check { scale: 1; }

      h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.1px; }
      .sub { margin: 8px 0 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-height: 22px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
      .sub b { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; background: #fff; box-shadow: 0 0 0 1px var(--line); color: var(--text); font-weight: 600; }
      .sub b:last-of-type { background: linear-gradient(140deg, #3D7BFA, #A68BF7); color: #fff; box-shadow: none; }
      .sub .arrow { margin: 0; color: var(--faint); }
      .progress-area { margin: 16px 0 0; text-align: left; }
      .progress-area[hidden] { display: none; }
      .progress-label { display:flex; justify-content:space-between; gap:12px; margin-bottom:7px; font-size:12px; color:var(--text-2); font-variant-numeric:tabular-nums; }
      .progress-track { height:8px; overflow:hidden; border-radius:8px; background:#E0E5F1; }
      .progress-fill { display:block; height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,#6F9CFF,#8C78DE); transition:width .2s linear; }
      .progress-caption { margin:7px 0 0; font-size:11px; color:var(--muted); }

      .mid { flex: 1; min-height: 0; padding: 18px 24px 1px; display: flex; flex-direction: column; overflow: auto; -webkit-app-region: no-drag; }
      .notes { flex: 1; min-height: 78px; overflow: auto; padding: 14px 16px; border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px rgba(20, 26, 38, .05), 0 10px 24px -18px rgba(20, 26, 60, .35);
        color: var(--text-2); font-size: 12.5px; user-select: text; }
      .notes h4 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
      .notes p { margin: 0 0 6px; }
      .notes ul { margin: 0 0 6px; padding-left: 18px; }
      .notes li { margin: 3px 0; }
      .notes li::marker { color: #A68BF7; }
      .notes .empty { color: var(--faint); }
      .notes .sk { display: block; height: 11px; margin: 9px 0; border-radius: 6px; background: linear-gradient(90deg, #ECEEF3 0%, #F6F7FA 40%, #ECEEF3 80%) 0 0 / 200% 100%; animation: sk 1.3s linear infinite; }
      @keyframes sk { from { background-position: 100% 0; } to { background-position: -100% 0; } }
      .notes::-webkit-scrollbar { width: 8px; } .notes::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
      .msg { margin-top: 10px; padding: 9px 12px; border-radius: 12px; font-size: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line); color: var(--text-2); flex-shrink: 0; max-height: 100px; overflow: auto; overflow-wrap: anywhere; }
      .msg.bad { background: #FDECEC; box-shadow: none; color: var(--danger); }
      .msg[hidden] { display: none; }
      .required-note { margin-bottom: 12px; padding: 12px 14px; border: 1px solid #F4CF9A; border-radius: 12px; background: #FFF6E7; color: #78521C; font-size: 12px; max-height: 180px; overflow: auto; flex-shrink: 0; -webkit-app-region: no-drag; }
      .required-note strong { display: block; margin-bottom: 5px; font-size: 13px; }
      .required-note p { margin: 4px 0 0; overflow-wrap: anywhere; }
      .required-note[hidden] { display: none; }
      .notes { overflow-wrap: anywhere; }

      .bar { display: flex; align-items: center; gap: 8px; padding: 16px 24px 22px; flex-shrink: 0; }
      .bar .grow { flex: 1; }
      .btn { height: 36px; padding: 0 18px; border-radius: 18px; border: 0; background: #fff; box-shadow: 0 0 0 1px var(--line); color: var(--text); font: 600 12.5px var(--font);
        cursor: pointer; transition: background .18s, transform .12s; white-space: nowrap; }
      .btn:hover { background: var(--soft); }
      .btn:active { transform: scale(.97); }
      .btn:disabled { opacity: .5; cursor: default; }
      .btn.primary { box-shadow: none; background: #141A26; color: #fff; }
      .btn.primary:hover { background: #283042; }
      .btn.link { box-shadow: none; background: transparent; color: var(--muted); padding: 0 6px; font-weight: 500; }
      .btn.link:hover { color: var(--text); background: transparent; }
      .btn[hidden] { display: none; }
      .btn:focus-visible { outline: 2px solid rgba(61, 123, 250, .45); outline-offset: 2px; }
      @media (max-height: 600px) { .top { padding-top: 8px; } .orbwrap { height: 116px; margin-bottom: 4px; } .orbwrap > .orb { scale: .72; } .required-note { max-height: 110px; } .progress-area { margin-top: 10px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <button class="x" id="close" type="button" aria-label="关闭" title="关闭"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
    <div class="top">
      <div class="orbwrap" id="stage">
        <div class="orb-shadow" aria-hidden="true"></div>
        <div class="orb" id="orb" aria-hidden="true"><span class="orb-face"><i class="eye"></i><i class="eye"></i></span></div>
        <div class="check" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg></div>
      </div>
      <h1 id="title">正在检查更新…</h1>
      <p class="sub" id="sub" role="status"></p>
      <div class="progress-area" id="progressArea" hidden><div class="progress-label"><span id="progressLabel">下载更新</span><strong id="progressPercent">0%</strong></div><div class="progress-track" id="progress" role="progressbar" aria-label="更新下载进度" aria-valuemin="0" aria-valuemax="100"><span class="progress-fill" id="progressFill"></span></div><p class="progress-caption" id="progressCaption">下载后自动校验，任务结束后自动安装并重启</p></div>
    </div>
    <div class="mid">
      <div class="required-note" id="requiredNote" role="alert" hidden><strong>当前版本需要更新后才能发起新任务</strong><p id="requiredReason"></p><p id="requiredFloor"></p><p>已有任务可以继续完成、审批或停止，结束后自动安装并重启。</p></div>
      <div class="notes" id="notes"><h4>更新内容</h4><div id="notesBody"><span class="sk" style="width:62%"></span><span class="sk" style="width:88%"></span><span class="sk" style="width:74%"></span></div></div>
      <div class="msg" id="msg" hidden></div>
      <button class="btn link" id="diagnostics" type="button" hidden>复制更新诊断</button>
    </div>
    <div class="bar">
      <button class="btn link" id="skip" type="button" hidden>跳过这个版本</button>
      <span class="grow"></span>
      <button class="btn" id="page" type="button" hidden>前往发布页</button>
      <button class="btn" id="later" type="button">稍后</button>
      <button class="btn primary" id="go" type="button" hidden>立即更新</button>
    </div>
    <script>
      (function () {
        const api = window.salcaraUpdate;
        const $ = (id) => document.getElementById(id);
        const mb = (n) => (n / 1048576).toFixed(n >= 104857600 ? 0 : 1) + ' MB';
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        let notesFor = null;

        // Release notes: plain text with "- " bullets and "#" headings, nothing else is interpreted.
        function renderNotes(text) {
          const lines = String(text || '').replace(/\r/g, '').split('\n');
          let html = '', list = false;
          for (const raw of lines) {
            const line = raw.trim();
            const bullet = /^[-*•]\s+(.*)$/.exec(line);
            if (bullet) { if (!list) { html += '<ul>'; list = true; } html += `<li>${esc(bullet[1].replace(/\*\*/g, ''))}</li>`; continue; }
            if (list) { html += '</ul>'; list = false; }
            if (!line) continue;
            html += `<p>${esc(line.replace(/^#+\s*/, '').replace(/\*\*/g, ''))}</p>`;
          }
          if (list) html += '</ul>';
          return html || '<p class="empty">这个版本没有填写更新说明</p>';
        }

        function show(el, on) { $(el).hidden = !on; }
        function render(s) {
          if (!s) return;
          const stage = $('stage');
          stage.className = 'orbwrap';
          const busy = s.phase === 'downloading' || s.phase === 'verifying' || s.phase === 'checking' || s.phase === 'installing';
          if (busy) stage.classList.add('busy');
          if (s.phase === 'verifying' || s.phase === 'checking' || s.phase === 'installing') stage.classList.add('indeterminate');
          if (s.phase === 'ready' || s.phase === 'waiting') stage.classList.add('done');
          if (s.phase === 'error') stage.classList.add('failed');
          const p = s.phase === 'downloading' && s.size ? Math.min(1, (s.received || 0) / s.size) : ['ready', 'verifying', 'waiting', 'installing'].includes(s.phase) ? 1 : 0;
          const progressVisible = ['downloading', 'verifying', 'ready', 'waiting', 'installing'].includes(s.phase);
          show('progressArea', progressVisible);
          $('progressFill').style.width = `${Math.floor(p * 100)}%`;
          $('progress').setAttribute('aria-valuenow', String(Math.floor(p * 100)));
          $('progressPercent').textContent = `${Math.floor(p * 100)}%`;
          $('progressLabel').textContent = s.phase === 'downloading' ? '正在下载' : s.phase === 'verifying' ? '下载完成 · 正在校验' : s.phase === 'installing' ? '下载完成 · 正在安装' : '下载完成';
          $('progressCaption').textContent = s.distributionReason || (s.phase === 'waiting' ? (s.waitReason || '等待已有任务结束，将自动继续安装') : s.phase === 'downloading' && s.retryAttempt ? `连接中断后自动重试 · 第 ${s.retryAttempt} 次` : '下载后自动校验，任务结束后自动安装并重启');

          const v = s.version ? `<b>${esc(s.current)}</b><span class="arrow">→</span><b>${esc(s.version)}</b>` : '';
          const titles = { checking: '正在检查更新…', latest: '已经是最新版本', unconfigured: '没有配置更新源', available: '发现新版本', downloading: '正在下载更新',
            verifying: '正在校验与解压', ready: '即将自动安装', waiting: '等待当前任务结束', installing: '正在安装并重启…', error: '更新没有完成', idle: '软件更新' };
          $('title').textContent = titles[s.phase] || '软件更新';
          if (s.required && s.phase === 'available') $('title').textContent = '需要更新才能继续';
          if (s.autoBlocked) $('title').textContent = '已保护性停止自动更新';
          else if (s.distributionReason) $('title').textContent = '等待更新开放';
          show('requiredNote', s.required === true);
          $('requiredReason').textContent = s.updateReason || '当前版本已不再受支持，请更新以继续使用。';
          $('requiredFloor').textContent = s.minimumSupportedVersion ? `最低支持版本 ${s.minimumSupportedVersion} · 当前 ${s.current}` : '';
          let sub = '';
          if (s.phase === 'latest') sub = `当前版本 <b>${esc(s.current)}</b>`;
          else if (s.phase === 'available') sub = `${v}${s.size ? ` · ${mb(s.size)}` : ''}`;
          else if (s.phase === 'downloading') sub = `${mb(s.received || 0)} / ${mb(s.size || 0)}${s.speed ? ` · ${mb(s.speed)}/s` : ''} · ${Math.floor(p * 100)}%`;
          else if (s.phase === 'verifying') sub = '核对签名和文件完整性';
          else if (s.phase === 'ready') sub = `将自动更新至 <b>${esc(s.version)}</b>`;
          else if (s.phase === 'waiting') sub = '无需操作，任务结束后会自动继续';
          else if (s.phase === 'installing') sub = 'Salcara Bridge 会自动重新打开';
          else if (s.phase === 'unconfigured') sub = '这个版本没有配置更新源，请到官网下载新版';
          else if (v) sub = v;
          $('sub').innerHTML = sub;

          const hasRelease = Boolean(s.version);
          const checking = s.phase === 'checking' && !hasRelease;
          $('notes').style.visibility = hasRelease || checking ? 'visible' : 'hidden';
          if (checking) { notesFor = null; $('notesBody').innerHTML = '<span class="sk" style="width:62%"></span><span class="sk" style="width:88%"></span><span class="sk" style="width:74%"></span><span class="sk" style="width:46%"></span>'; }
          else if (hasRelease && notesFor !== s.version + ':' + s.notes) { notesFor = s.version + ':' + s.notes; $('notesBody').innerHTML = renderNotes(s.notes); }

          const msg = [s.phase === 'error' ? s.error : s.phase === 'available' && !s.canInstall ? s.reason : '', s.distributionReason, s.failureReason, s.required ? s.policyError : ''].filter(Boolean).join('；');
          $('msg').textContent = msg || '';
          $('msg').className = 'msg' + (s.phase === 'error' ? ' bad' : '');
          show('msg', Boolean(msg));
          show('diagnostics', s.phase === 'error' || Boolean(s.autoBlocked));

          const go = $('go');
          show('skip', s.phase === 'available' && !s.required);
          show('page', Boolean(s.page) && (s.phase === 'error' || s.phase === 'unconfigured' || (s.phase === 'available' && !s.canInstall)));
          $('page').textContent = '手动下载安装';
          go.hidden = true;
          if (s.phase === 'available' && s.canInstall && !s.distributionReason) { go.hidden = false; go.textContent = s.autoBlocked ? '手动重试此版本' : '立即更新'; go.onclick = () => api.download(); }
          else if (s.phase === 'ready' && !s.automatic) { go.hidden = false; go.textContent = '继续更新'; go.onclick = () => api.install(); }
          else if (s.phase === 'error' && s.canRetry) { go.hidden = false; go.textContent = s.retry === 'install' ? '重试安装' : '重试'; go.onclick = () => (s.retry === 'install' ? api.install() : s.retry === 'download' ? api.download() : api.check()); }
          if (s.distributionReason) { go.hidden = false; go.textContent = '重新检查'; go.onclick = () => api.check(); }
          const later = $('later');
          later.hidden = s.phase === 'installing';
          later.textContent = s.phase === 'downloading' ? '取消下载' : s.phase === 'waiting' || s.phase === 'ready' || s.phase === 'verifying' ? '后台更新' : s.required ? '返回查看任务' : s.phase === 'latest' || s.phase === 'unconfigured' ? '好的' : '稍后';
          later.onclick = () => (s.phase === 'downloading' ? api.cancel() : api.later());
          later.disabled = false;
        }

        $('close').onclick = () => (api ? api.later() : window.close());
        $('skip').onclick = () => api.skip();
        $('page').onclick = () => api.openPage();
        $('diagnostics').onclick = async () => { try { if (await api.copyDiagnostics()) $('diagnostics').textContent = '已复制诊断信息'; } catch { $('diagnostics').textContent = '复制失败，请重试'; } };
        addEventListener('keydown', (e) => {
          if (e.key === 'Escape') $('close').click();
          else if (e.key === 'Enter' && !(e.target instanceof HTMLButtonElement) && !$('go').hidden) $('go').click();
        });
        if (!api) return;
        let revision = 0;
        api.onState(s => { revision++; render(s); });
        const initial = revision;
        api.state().then(s => { if (initial !== revision) return; render(s); if (s?.phase === 'idle') api.check(); }).catch(() => {
          $('title').textContent = '暂时无法读取更新状态';
          $('go').hidden = false; $('go').textContent = '重新检查'; $('go').onclick = () => api.check();
        });

        // An occasional blink, never on a fixed beat.
        const orb = $('orb');
        (function blink() { orb.classList.remove('blink'); void orb.offsetWidth; orb.classList.add('blink'); setTimeout(blink, 2400 + Math.random() * 3600); })();
      })();
    </script>
  </body>
</html>
