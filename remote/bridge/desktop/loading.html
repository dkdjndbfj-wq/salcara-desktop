<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salcara Bridge</title>
    <!--
      Start-up animation, part 1. A point of light ignites, a brand-coloured arc
      sweeps around it, the light swells into the white orb and cools, the eyes
      open and the name writes itself. The final frame matches the console's
      first frame (?boot=1, web/boot.js), which carries the orb and the name to
      their places on the home screen.
    -->
    <style>
      @property --sweep { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
      @property --rot { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
      @property --hx { syntax: "<percentage>"; inherits: false; initial-value: 50%; }
      @property --hy { syntax: "<percentage>"; inherits: false; initial-value: 50%; }
      @property --reveal { syntax: "<length>"; inherits: false; initial-value: 0px; }

      :root {
        --bg: #f3f5f9; --text: #141a26; --text-2: #3a4356; --muted: #6e7789; --faint: #a3abbb;
        --glow: #ffffff; --dot: rgba(20, 30, 60, .07); --ctl-hover: rgba(20, 30, 60, .06);
        --S: 224px; --cy: calc(50% + 3px);
        --expo: cubic-bezier(.16, 1, .3, 1);
        --inout: cubic-bezier(.65, 0, .35, 1);
        --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", "Noto Sans CJK SC", sans-serif;
        color-scheme: light;
      }
      /* the same size and place as the home screen's big orb (shell.css .orb-zone) */
      @media (max-height: 760px) { :root { --S: 188px; } }
      @media (max-height: 620px) { :root { --S: 157px; } }
      @media (max-width: 760px) { :root { --S: 175px; } }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #121419; --text: #e8ebf2; --text-2: #b9c0cf; --muted: #8e96a8; --faint: #5d6576;
          --glow: rgba(255, 255, 255, .06); --dot: rgba(255, 255, 255, .06); --ctl-hover: rgba(255, 255, 255, .08); color-scheme: dark; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      html { -webkit-app-region: drag; }
      body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 14px var(--font); -webkit-font-smoothing: antialiased; user-select: none; }

      /* The same backdrop as the console's home screen; the dot grid opens outwards from the centre. */
      .bg { position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(600px circle at 50% 46%, var(--glow) 0%, transparent 70%), radial-gradient(var(--dot) 1px, transparent 1px) 0 0 / 26px 26px, var(--bg);
        -webkit-mask: radial-gradient(circle at 50% 50%, #000 var(--reveal), transparent calc(var(--reveal) + 220px));
        animation: reveal 1.5s .05s var(--expo) both; }
      @keyframes reveal { from { --reveal: 0px; } to { --reveal: 1600px; } }
      body.done .bg { -webkit-mask: none; }

      .scene { position: fixed; left: 50%; top: var(--cy); width: 0; height: 0; }
      .scene > * { position: absolute; left: 0; top: 0; translate: -50% -50%; }

      /* a soft brand-coloured bloom behind the orb that cools away */
      .halo { width: calc(var(--S) * 1.7); height: calc(var(--S) * 1.7); border-radius: 50%; filter: blur(34px);
        background: conic-gradient(from 200deg, #7CC6FF, #3D7BFA, #A68BF7, #F4A6CE, #7CC6FF);
        opacity: 0; animation: halo 2s .1s var(--expo) both; }
      @keyframes halo { 0% { opacity: 0; scale: .2; } 30% { opacity: .55; } 100% { opacity: 0; scale: 1.15; } }

      /* the arc that draws itself around the light, then lets go */
      .sweep { width: calc(var(--S) + 64px); height: calc(var(--S) + 64px); border-radius: 50%;
        animation: draw .9s .12s var(--inout) both, release .7s .92s var(--expo) both; }
      .sweep::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0deg, #7CC6FF calc(var(--sweep) * .12), #3D7BFA calc(var(--sweep) * .45), #A68BF7 calc(var(--sweep) * .78), #F4A6CE var(--sweep), transparent var(--sweep));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px)); }
      .sweep::after { content: ""; position: absolute; left: 50%; top: 0; width: 8px; height: 8px; margin: -3px 0 0 -4px; border-radius: 50%;
        background: #fff; box-shadow: 0 0 0 3px rgba(244, 166, 206, .35), 0 0 14px 4px rgba(166, 139, 247, .65);
        transform-origin: 4px calc(var(--S) / 2 + 35px); rotate: var(--sweep); animation: head .9s .12s linear both; }
      @keyframes head { 0% { opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes draw { from { --sweep: 0deg; } to { --sweep: 360deg; } }
      @keyframes release { from { scale: 1; opacity: 1; rotate: 0deg; } to { scale: 1.32; opacity: 0; rotate: 40deg; } }

      /* the orb: the console's lit white sphere, born from the light */
      .orb { width: var(--S); height: var(--S); border-radius: 50%; overflow: hidden;
        background:
          radial-gradient(circle at var(--hx) var(--hy), #fff 0%, #fff 16%, rgba(255, 255, 255, 0) 46%),
          radial-gradient(circle at 50% 42%, #fbfcfe 0%, #eef1f6 52%, #d3d9e4 82%, #b9c1d0 100%);
        box-shadow: inset -14px -20px 34px rgba(110, 122, 148, .30), inset 10px 12px 26px rgba(255, 255, 255, .9),
          0 2px 3px rgba(30, 40, 70, .08), 0 22px 40px -8px rgba(30, 40, 70, .22), 0 44px 80px -20px rgba(30, 40, 70, .22);
        animation: bloom 1.05s .2s var(--expo) both, light 1.2s .2s var(--expo) both; }
      @keyframes bloom { from { scale: .04; filter: blur(6px) brightness(1.6); opacity: 0; } 18% { opacity: 1; } to { scale: 1; filter: none; opacity: 1; } }
      @keyframes light { from { --hx: 50%; --hy: 50%; } to { --hx: 34%; --hy: 28%; } }
      /* the brand colours inside the newborn orb, cooling to white */
      .tint { position: absolute; inset: -10%; border-radius: 50%; mix-blend-mode: multiply;
        background: conic-gradient(from var(--rot), #7CC6FF, #3D7BFA, #A68BF7, #F4A6CE, #7CC6FF); filter: blur(10px);
        animation: spin 1.6s linear infinite, cool 1.1s .45s ease-in both; }
      @keyframes spin { to { --rot: 360deg; } }
      @keyframes cool { from { opacity: .9; } to { opacity: 0; visibility: hidden; } }
      .orb::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 7%; height: 18%; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 255, 255, .55), transparent); }

      .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: calc(var(--S) * .16); }
      .face i { display: block; width: calc(var(--S) * .0625); height: calc(var(--S) * .25); border-radius: 99px; background: #10131a;
        box-shadow: inset 0 -3px 4px rgba(255, 255, 255, .08); scale: 1 .07; opacity: 0;
        animation: lids .2s .95s ease-out both, wake .42s 1.18s var(--expo) both; }
      @keyframes lids { to { opacity: 1; } }
      @keyframes wake { 0% { scale: 1 .07; } 60% { scale: 1 1.08; } 100% { scale: 1 1; } }
      .face.blink i { animation: blink .2s ease-in-out; scale: 1 1; opacity: 1; }
      @keyframes blink { 50% { scale: 1 .08; } }
      .face { transition: translate .5s var(--expo); }

      .shadow { top: calc(var(--S) * .55 + 12px); width: calc(var(--S) * .8); height: calc(var(--S) * .13); border-radius: 50%;
        background: radial-gradient(closest-side, rgba(25, 35, 60, .34), rgba(25, 35, 60, .12) 60%, transparent); filter: blur(3px);
        animation: shade 1s .3s var(--expo) both; }
      @keyframes shade { from { scale: .1; opacity: 0; } to { scale: 1; opacity: 1; } }

      /* the name, set like the console header so it can fly there */
      .brand { position: fixed; left: 50%; top: calc(var(--cy) + var(--S) * .5 + 52px); translate: -50% 0; white-space: nowrap;
        font-size: 28px; font-weight: 700; letter-spacing: .8px; color: var(--text); }
      .brand .b2 { margin-left: 12px; font-weight: 400; color: var(--muted); }
      .brand span span { display: inline-block; opacity: 0; filter: blur(8px); translate: 0 10px;
        animation: letter .7s calc(1.02s + var(--i) * 45ms) var(--expo) both; }
      @keyframes letter { to { opacity: 1; filter: blur(0); translate: 0 0; } }

      .status { position: fixed; left: 0; right: 0; bottom: 64px; text-align: center; margin: 0; font-size: 12.5px; letter-spacing: 1px; color: var(--muted);
        opacity: 0; transition: opacity .6s; }
      body.slow .status { opacity: 1; }
      .status em { display: block; width: 72px; height: 2px; margin: 12px auto 0; border-radius: 2px; overflow: hidden; background: var(--dot); position: relative; }
      .status em::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #3D7BFA, #A68BF7, transparent); animation: slide 1.3s var(--inout) infinite; }
      @keyframes slide { from { translate: -100% 0; } to { translate: 250% 0; } }

      /* window buttons: identical to the console's, so nothing jumps at the hand-over */
      .win-ctl { position: fixed; z-index: 9; top: 16px; right: 18px; display: flex; gap: 4px; -webkit-app-region: no-drag; }
      .win-ctl button { width: 32px; height: 32px; border-radius: 10px; border: 0; padding: 0; display: grid; place-items: center; cursor: pointer;
        color: var(--text-2); background: transparent; transition: background .18s, color .18s; }
      .win-ctl button svg { width: 15px; height: 15px; }
      .win-ctl button:hover { background: var(--ctl-hover); color: var(--text); }
      .win-ctl button.x:hover { background: #E5484D; color: #fff; }
      .win-ctl[data-plain] #winMin { display: none; }

      /* failure: everything already in place, no ceremony */
      body.failed .bg, body.failed .orb, body.failed .shadow, body.failed .brand span span, body.failed .face i { animation: none !important; }
      body.failed .bg { -webkit-mask: none; }
      body.failed .halo, body.failed .sweep, body.failed .tint { display: none; }
      body.failed .brand span span { opacity: 1; filter: none; translate: 0 0; }
      body.failed .face i { opacity: 1; scale: 1 .45; translate: 0 calc(var(--S) * .05); }
      body.failed .status { bottom: auto; top: calc(var(--cy) + var(--S) * .5 + 100px); opacity: 1; color: var(--text-2); max-width: 520px; margin: 0 auto; padding: 0 24px; line-height: 1.6; letter-spacing: .3px; }
      body.failed .status em { display: none; }
      .retry { display: block; margin: 16px auto 0; height: 36px; padding: 0 18px; border: 0; border-radius: 18px; background: var(--text); color: var(--bg);
        font: inherit; cursor: pointer; -webkit-app-region: no-drag; }
      .retry[hidden] { display: none; }
      .retry:disabled { opacity: .6; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
        .halo, .sweep { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="win-ctl" id="winCtl" data-plain>
      <button type="button" id="winMin" aria-label="最小化" title="最小化"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 8h9"/></svg></button>
      <button type="button" class="x" id="winClose" aria-label="关闭" title="关闭"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="scene" aria-hidden="true">
      <div class="halo"></div>
      <div class="shadow"></div>
      <div class="sweep"></div>
      <div class="orb"><div class="tint"></div><div class="face" id="face"><i></i><i></i></div></div>
    </div>
    <div class="brand" id="brand" aria-label="Salcara Bridge"><span class="b1">Salcara</span><span class="b2">Bridge</span></div>
    <div class="status" id="status" role="status"><span id="message">正在启动核心…</span><em></em>
      <button id="retry" class="retry" type="button" hidden>重新启动核心</button></div>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const error = params.get('error');
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Split the name into letters for the write-on.
        let n = 0;
        for (const part of document.querySelectorAll('#brand > span')) {
          const text = part.textContent; part.textContent = '';
          for (const ch of text) { const s = document.createElement('span'); s.textContent = ch; s.style.setProperty('--i', n++); part.appendChild(s); }
          n += 2;
        }

        // Window buttons work through the desktop shell; the page stays usable without it.
        const win = window.salcaraWindow;
        if (win) document.getElementById('winCtl').removeAttribute('data-plain');
        document.getElementById('winMin').onclick = () => win && win.minimize();
        document.getElementById('winClose').onclick = () => window.close();

        if (error) {
          document.body.classList.add('failed', 'done');
          document.getElementById('message').textContent = error;
          const retry = document.getElementById('retry');
          if (params.get('retry') && window.salcaraCore) {
            retry.hidden = false;
            retry.addEventListener('click', () => { retry.disabled = true; retry.textContent = '正在重新启动…'; window.salcaraCore.retry(); });
          }
          window.__bootReady = Promise.resolve(false);
          return;
        }

        // The shell waits for this before handing over to the console, so the intro always finishes.
        window.__bootReady = new Promise((resolve) => setTimeout(() => resolve(true), reduced ? 0 : 1650));
        setTimeout(() => document.body.classList.add('done'), reduced ? 0 : 1600);
        // Only mention the core if it is actually taking a while.
        setTimeout(() => document.body.classList.add('slow'), 2600);

        // While waiting: an occasional blink and a glance, never on a fixed beat.
        const face = document.getElementById('face');
        function blink() {
          face.classList.remove('blink'); void face.offsetWidth; face.classList.add('blink');
          timers.push(setTimeout(blink, 2200 + Math.random() * 3200));
        }
        function glance() {
          const x = (Math.random() - .5) * 14, y = (Math.random() - .5) * 8;
          face.style.translate = `${x}px ${y}px`;
          timers.push(setTimeout(() => { face.style.translate = '0 0'; }, 700 + Math.random() * 500));
          timers.push(setTimeout(glance, 2600 + Math.random() * 2600));
        }
        const timers = [];
        if (!reduced) { timers.push(setTimeout(blink, 2400), setTimeout(glance, 1900)); }
        // Called by the shell right before the hand-over: stop moving and look straight ahead.
        window.__settle = () => {
          timers.forEach(clearTimeout);
          const moved = face.style.translate && face.style.translate !== '0 0' && face.style.translate !== '0px 0px';
          face.style.translate = '0 0';
          return new Promise((r) => setTimeout(r, moved ? 450 : 0));
        };
      })();
    </script>
  </body>
</html>
