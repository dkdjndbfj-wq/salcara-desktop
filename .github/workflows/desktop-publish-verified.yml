name: Verify prior Windows build and stage release
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        description: Successful desktop-release workflow run ID
      source_check_run_id:
        required: true
        description: Successful desktop-check (Linux) workflow run ID for the same commit
      source_sha:
        required: true
        description: Exact tested 40-character source commit
permissions:
  contents: write
  actions: read
concurrency:
  group: desktop-release-publishing
  cancel-in-progress: false
jobs:
  verify-and-stage:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact successful native and Linux runs from the same source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run_id }}
          SOURCE_CHECK_RUN_ID: ${{ inputs.source_check_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: pwsh
        run: |
          node remote/bridge/desktop/scripts/verify-release-runs.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Same-source native and Linux checks required' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN/artifacts" | ConvertFrom-Json
          $asset = @($artifacts.artifacts | Where-Object { $_.name -eq 'salcara-desktop-windows-signed' -and -not $_.expired })
          if ($LASTEXITCODE -ne 0 -or $asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Exact unexpired artifact required' }
          $env:ARTIFACT_ID = [string]$asset[0].id
          $env:ARTIFACT_DIGEST = [string]$asset[0].digest
          node remote/bridge/desktop/scripts/download-release-artifact.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Pinned artifact download or digest verification failed' }
          if (Test-Path -LiteralPath verified-artifact) { throw 'Artifact extraction directory must be new' }
          Expand-Archive -LiteralPath verified-artifact-download/artifact.zip -DestinationPath verified-artifact
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: tested-source
          persist-credentials: false
      - name: Verify hashes, signature, USTAR policy and complete portable package
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -LiteralPath verified-artifact -Filter '*.zip' -File)
          if ($zip.Count -ne 1) { throw 'Exact portable ZIP required' }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath verified-portable
          node tested-source/remote/bridge/desktop/scripts/verify-release-artifact.cjs verified-artifact verified-portable
          if ($LASTEXITCODE -ne 0) { throw 'Artifact verification failed' }
      - name: Upload verified assets to an unpublished draft for release review
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: pwsh
        run: |
          $version = (Get-Content tested-source/remote/bridge/desktop/package.json -Raw | ConvertFrom-Json).version
          $files = @(Get-ChildItem -LiteralPath verified-artifact -File | ForEach-Object FullName)
          if (-not (Test-Path -LiteralPath "tested-source/docs/RELEASE-$version.md" -PathType Leaf)) { throw 'Exact release notes required before tag reservation' }
          $env:RELEASE_VERSION = $version
          node remote/bridge/desktop/scripts/verify-release-runs.cjs reserve-tag
          if ($LASTEXITCODE -ne 0) { throw 'New release tag reservation failed; existing tags are not reused or overwritten' }
          gh release create "v$version" @files --repo $env:GITHUB_REPOSITORY --verify-tag --title "Salcara Desktop v$version" --notes-file "tested-source/docs/RELEASE-$version.md" --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release staging failed' }
