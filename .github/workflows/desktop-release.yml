name: Build signed Windows desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remote/bridge/desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: remote/bridge/go.sum
      - name: Canonical runner-owned temporary directory
        shell: pwsh
        run: |
          # Short-path aliases must not weaken production descriptor policy.
          $fixtureTemp = node -e "console.log(require('node:fs').realpathSync(process.env.RUNNER_TEMP))"
          "TEMP=$fixtureTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$fixtureTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Desktop tests (including synthetic Windows swap and rollback)
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -LiteralPath remote/bridge/desktop/test -Filter '*.test.cjs' -File | ForEach-Object FullName)
          node --test @tests
      - name: Companion tests
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs'),os=require('node:os');const t=os.tmpdir(),r=fs.realpathSync(t);console.log({fixtureTemp:t,canonical:r});if(t.toLowerCase()!==r.toLowerCase())throw new Error('Fixture temp must be canonical')"
          $tests = @(Get-ChildItem -LiteralPath remote/desktop-companion/tests -Filter '*.test.mjs' -File | ForEach-Object FullName)
          node --test @tests
      - name: Bridge Windows unit tests
        working-directory: remote/bridge
        # These five historical assertions target POSIX/macOS behavior; the
        # separate Linux source workflow runs them without this exclusion.
        run: go test -short ./... -skip '^(TestCodexFlow|TestClaudeHistory|TestCodexItemMapping|TestClaudeToolDescriptions|TestNeedsInstall)$' -count=1
      - name: Bridge vet
        working-directory: remote/bridge
        run: go vet ./...
      - name: Install pinned packaging dependencies
        working-directory: remote/bridge/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build complete desktop directory
        working-directory: remote/bridge/desktop
        run: npm run package
      - name: Import desktop signing identity from secret
        env:
          DESKTOP_UPDATE_KEY: ${{ secrets.SALCARA_DESKTOP_UPDATE_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_UPDATE_KEY)) { throw 'Missing desktop signing secret' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'salcara-desktop-update-signing-key.pem'
          [IO.File]::WriteAllText($keyPath, $env:DESKTOP_UPDATE_KEY)
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $acl = [Security.AccessControl.FileSecurity]::new()
          $acl.SetAccessRuleProtection($true, $false)
          $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($identity.User, 'FullControl', 'Allow'))
          Set-Acl -LiteralPath $keyPath -AclObject $acl
          "SALCARA_UPDATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Create and verify signed update manifest and archive
        working-directory: remote/bridge/desktop
        run: npm run release -- --notes ../../../docs/RELEASE-1.6.0.md
      - name: Create portable download and checksum list
        working-directory: remote/bridge/desktop
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $built = Join-Path (Get-Location) 'out/Salcara Bridge-win32-x64'
          $release = Join-Path (Get-Location) 'out/release'
          Compress-Archive -LiteralPath $built -DestinationPath (Join-Path $release "Salcara-Bridge-$version-win32-x64.zip")
          $lines = Get-ChildItem -LiteralPath $release -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllLines((Join-Path $release 'SHA256SUMS.txt'), $lines)
      - uses: actions/upload-artifact@v4
        with:
          name: salcara-desktop-windows-signed
          path: remote/bridge/desktop/out/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing identity
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'salcara-desktop-update-signing-key.pem'
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
      # Root task verifies these artifacts and creates v<version>; this workflow
      # does not create, overwrite or expose a GitHub Release on its own.
