name: Build Windows installer and signed updates
on:
  workflow_dispatch:
    inputs:
      minimum_supported_version:
        description: '最低支持的桌面版本（留空为普通更新；三段数字且不得高于本次版本）'
        required: false
        type: string
      update_reason:
        description: '必须更新的原因（可选，最多 1000 字符；需同时填写最低支持版本）'
        required: false
        type: string
      windows_signing:
        description: '使用已配置的 Windows 代码签名证书（默认关闭；更新包仍必须通过 Ed25519 签名）'
        required: false
        type: boolean
        default: false
      release_control:
        description: '启用已发布的 GitHub 签名分发控制（需先运行 Publish signed desktop rollout control）'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remote/bridge/desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: remote/bridge/go.sum
      - name: Canonical runner-owned temporary directory
        shell: pwsh
        run: |
          # Keep fixtures on a canonical, runner-owned child rather than the
          # shared RUNNER_TEMP root. The child receives the current runner
          # identity as its owner, which is required by the descriptor ACL
          # tests on Windows 2025 while still avoiding short-path aliases.
          $fixtureTemp = Join-Path $env:RUNNER_TEMP 'salcara-fixtures'
          New-Item -ItemType Directory -Path $fixtureTemp -Force | Out-Null
          $fixtureTemp = node -e "console.log(require('node:fs').realpathSync(process.argv[1]))" $fixtureTemp
          "TEMP=$fixtureTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$fixtureTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Desktop tests (including synthetic Windows swap and rollback)
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -LiteralPath remote/bridge/desktop/test -Filter '*.test.cjs' -File | ForEach-Object FullName)
          node --test @tests
      - name: Validate isolated installer account environment
        shell: pwsh
        run: ./remote/bridge/desktop/scripts/test-installer.ps1 -ProfileOnly
      - name: Companion tests
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs'),os=require('node:os');const t=os.tmpdir(),r=fs.realpathSync(t);console.log({fixtureTemp:t,canonical:r});if(t.toLowerCase()!==r.toLowerCase())throw new Error('Fixture temp must be canonical')"
          $tests = @(Get-ChildItem -LiteralPath remote/desktop-companion/tests -Filter '*.test.mjs' -File | ForEach-Object FullName)
          node --test @tests
      - name: Bridge Windows unit tests
        working-directory: remote/bridge
        # These five historical assertions target POSIX/macOS behavior; the
        # separate Linux source workflow runs them without this exclusion.
        run: go test -short ./... -skip '^(TestCodexFlow|TestClaudeHistory|TestCodexItemMapping|TestClaudeToolDescriptions|TestNeedsInstall)$' -count=1
      - name: Bridge vet
        working-directory: remote/bridge
        run: go vet ./...
      - name: Install pinned packaging dependencies
        working-directory: remote/bridge/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build complete desktop directory
        working-directory: remote/bridge/desktop
        run: npm run package
      - name: Import optional Windows code signing certificate
        if: inputs.windows_signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.SALCARA_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SALCARA_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) { throw 'Windows signing was requested but no certificate is configured' }
          $certificateFile = Join-Path $env:RUNNER_TEMP 'salcara-windows-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificateFile -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (@($certificate).Count -ne 1 -or -not $certificate.HasPrivateKey) { throw 'One code-signing certificate with its private key is required' }
            "SALCARA_AUTHENTICODE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw 'Windows SDK signing tool is missing' }
            "SALCARA_SIGNTOOL=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally { if (Test-Path -LiteralPath $certificateFile) { Remove-Item -LiteralPath $certificateFile -Force } }
      - name: Sign and verify Windows payload
        if: inputs.windows_signing
        working-directory: remote/bridge/desktop
        run: node scripts/authenticode.cjs sign "out/Salcara Bridge-win32-x64"
      - name: Build current-user Windows installer
        working-directory: remote/bridge/desktop
        run: npm run installer
      - name: Sign and verify Windows installer
        if: inputs.windows_signing
        working-directory: remote/bridge/desktop
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/authenticode.cjs sign "out/release/Salcara-Desktop-$version-win32-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer signing failed' }
      - name: Install, reinstall, downgrade protection and uninstall (isolated Windows user)
        shell: pwsh
        run: ./remote/bridge/desktop/scripts/test-installer.ps1
      - name: Import desktop signing identity from secret
        env:
          DESKTOP_UPDATE_KEY: ${{ secrets.SALCARA_DESKTOP_UPDATE_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_UPDATE_KEY)) { throw 'Missing desktop signing secret' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'salcara-desktop-update-signing-key.pem'
          [IO.File]::WriteAllText($keyPath, $env:DESKTOP_UPDATE_KEY)
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $acl = [Security.AccessControl.FileSecurity]::new()
          $acl.SetAccessRuleProtection($true, $false)
          $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($identity.User, 'FullControl', 'Allow'))
          Set-Acl -LiteralPath $keyPath -AclObject $acl
          "SALCARA_UPDATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Create and verify signed update manifest and archive
        working-directory: remote/bridge/desktop
        shell: pwsh
        env:
          RELEASE_MINIMUM_SUPPORTED_VERSION: ${{ inputs.minimum_supported_version }}
          RELEASE_UPDATE_REASON: ${{ inputs.update_reason }}
          RELEASE_CONTROL: ${{ inputs.release_control }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseArgs = @('--notes', "../../../docs/RELEASE-$version.md")
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_MINIMUM_SUPPORTED_VERSION)) { $releaseArgs += @('--minimum-supported-version', $env:RELEASE_MINIMUM_SUPPORTED_VERSION) }
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_UPDATE_REASON)) { $releaseArgs += @('--update-reason', $env:RELEASE_UPDATE_REASON) }
          if ($env:RELEASE_CONTROL -eq 'true') { $releaseArgs += @('--control-url', "https://github.com/$env:GITHUB_REPOSITORY/releases/download/update-control/control.json") }
          node scripts/release.cjs @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Signed archive creation failed' }
      - name: Create portable download and checksum list
        working-directory: remote/bridge/desktop
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $built = Join-Path (Get-Location) 'out/Salcara Bridge-win32-x64'
          $release = Join-Path (Get-Location) 'out/release'
          Compress-Archive -LiteralPath $built -DestinationPath (Join-Path $release "Salcara-Bridge-$version-win32-x64.zip")
          $lines = Get-ChildItem -LiteralPath $release -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllLines((Join-Path $release 'SHA256SUMS.txt'), $lines)
      - name: Verify exact installer, portable package and signed update inventory
        working-directory: remote/bridge/desktop
        run: node scripts/verify-release-artifact.cjs out/release out
      - uses: actions/upload-artifact@v4
        with:
          name: salcara-desktop-windows-signed
          path: remote/bridge/desktop/out/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing identity
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'salcara-desktop-update-signing-key.pem'
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
          if ($env:SALCARA_AUTHENTICODE_THUMBPRINT -match '^[A-Fa-f0-9]{40}$') {
            $certificatePath = 'Cert:\CurrentUser\My\' + $env:SALCARA_AUTHENTICODE_THUMBPRINT
            if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -DeleteKey -Force }
          }
      # A separate verification workflow stages a draft v<version>; this workflow
      # does not create, overwrite or expose a GitHub Release on its own.
