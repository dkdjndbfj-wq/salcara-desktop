name: Verify all coordinated public release downloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download every public asset anonymously and verify exact source and hashes
        run: python3 -u .release-verification/verify-public.py
      - name: Verify public desktop Ed25519 manifest, USTAR archive and portable inventory
        run: node remote/bridge/desktop/scripts/verify-release-artifact.cjs verified-public-assets/desktop verified-portable
      - name: Verify public Hub publisher signature and both binaries
        run: node .release-verification/verify-hub.mjs verified-public-assets/hub 0.5.3 verified-public-assets/hub/standalone-account.json .release-verification/publisher-public.json
      - uses: actions/upload-artifact@v4
        with:
          name: coordinated-public-release-verification
          path: |
            verified-public-assets/verification.json
            verified-public-assets/*/latest.json
            verified-public-assets/*/latest.json.sig
            verified-public-assets/hub/standalone-account.json
            verified-public-assets/hub/image-receipt.json
          if-no-files-found: error
          retention-days: 30
