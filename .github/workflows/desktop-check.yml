name: Desktop source checks (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: remote/bridge/go.sum
      - name: Desktop tests (includes POSIX synthetic updater fixture)
        run: node --test remote/bridge/desktop/test/*.test.cjs
      - name: Companion tests (synthetic host)
        run: node --test remote/desktop-companion/tests/*.test.mjs
      - name: Bridge unit tests (short excludes cross-component Hub e2e)
        working-directory: remote/bridge
        run: go test -short ./... -count=1
      - name: Bridge vet
        working-directory: remote/bridge
        run: go vet ./...
      - name: Bridge unit race
        working-directory: remote/bridge
        run: go test -short -race ./... -count=1
      # No credentials, signing, package upload, or Release.
